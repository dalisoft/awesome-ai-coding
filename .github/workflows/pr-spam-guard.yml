name: PR Spam Guard

# Surfaces parallel-blast PR patterns to maintainers as a comment on every
# incoming pull request. Only auto-closes extreme cases (account <= 30 days old
# with >= 30 PRs in 14 days) — everything else is left to maintainers.
# Source: https://github.com/Zijian-Ni/awesome-ai-agents-2026

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Audit submitter
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { default: prSpamGuard } = await import('${{ github.workspace }}/.github/scripts/pr-spam-guard.js')

            await prSpamGuard({github, context, core})
